services:
    postgres:
        image: postgres:16-alpine
        container_name: app_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app_password
            POSTGRES_DB: app_db
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U app -d app_db']
            interval: 5s
            timeout: 5s
            retries: 10

    nats:
        image: nats:2.10-alpine
        container_name: app_nats
        restart: unless-stopped
        command: ['-js', '-sd', '/data', '-m', '8222']
        ports:
            - '4222:4222' # клиенты
            - '8222:8222' # мониторинг
        volumes:
            - natsdata:/data

volumes:
    pgdata:
    natsdata:
